  schemas:
    TraceId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: A trace id, as 32 hexadecimal characters.
    Duration:
      type: string
      pattern: '^P(?=\d|T\d)(?:\d+D)?(?:T(?=\d)(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$'
      description: |
        An ISO 8601 duration in days, hours, minutes and seconds, and not in longer units. The server writes and reads it in this form:
        `PT5S`, `PT2M`, `P1DT2H`, `PT0.001S`. Seconds can have a fraction, which the `duration` format of JSON Schema does not allow.
    CompileRequest:
      description: |
        The request as OpenAPI models a multipart body: an object whose properties are its parts. The pointers in the errors of a
        problem point into it (`#/options/outputs/ganttChart/width`).
      type: object
      additionalProperties: false
      properties:
        project:
          type: string
          contentMediaType: application/octet-stream
          description: A project (`.zpp`). Its file needs a name, because the outputs get their names from it.
        import:
          type: string
          contentMediaType: application/octet-stream
          description: An Excel workbook (`.xlsx`) to import into a new project.
        options:
          $ref: '#/components/schemas/CompileOptions'
      oneOf:
        - required: [project]
        - required: [import]
    ScenariosRequest:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          type: string
          contentMediaType: application/octet-stream
          description: A project (`.zpp`).
    CompileOptions:
      description: The options of `zpp`, without the paths. The maximum size is 64 KB, and the maximum nesting depth is 16. Each member can be `null`, which is the same as if the request does not give it.
      type: object
      additionalProperties: false
      properties:
        scenario:
          type: [string, 'null']
          description: The scenario to load, by name or by id. The id is the whole id, or a unique prefix of it of a minimum of four hexadecimal characters. Only with a `project`.
        baseTheme:
          type: [string, 'null']
          enum: [light, dark, null]
          default: light
        metricsFormat:
          type: [string, 'null']
          enum: [markdown, table, json, null]
          default: markdown
          description: How the console shows the metrics. It has no other effect.
        compileTimeout:
          anyOf:
            - $ref: '#/components/schemas/Duration'
            - type: 'null'
          examples: [PT5S]
          description: From `PT0.001S` to the `maxCompileTimeout` of the server. Without it, the value is `PT5S`, or the limit if that is shorter.
        now:
          type: [string, 'null']
          format: date-time
          description: A time with its offset from UTC. The job uses it in place of the clock.
        runSimulation:
          type: [boolean, 'null']
          default: false
          description: |
            Run the simulation of the schedule after the project compiles, as `zpp --run-simulation` does. The run uses the settings that
            the project holds (the iterations, the distribution, its shape value and the target) and the seed that it has saved, also
            when it is set to draw a new seed each time, and thus the same project gives the same result each time. A project with more
            iterations than the `maxSimulationIterations` of the server is a problem with the type `validation-failed`, at this member.
            Without this member, the server does not run the simulation, and the answer has the statistics of the result that the
            project holds, if it holds one.
        outputs:
          oneOf:
            - $ref: '#/components/schemas/OutputsOptions'
            - type: 'null'
    OutputsOptions:
      description: |
        The outputs to produce, in the order in which the job produces them. The job produces an output that the request gives. The
        output `simulation` is one request for the chart of the simulation and its CSV files, which are the statistics of the finish, its
        histogram split by critical path, the critical paths, and how often each activity was critical, and, for a run, every
        iteration. The answer lists each file as an output of its own (`simulationChart`, `simulationStatistics`, `simulationHistogram`,
        `simulationPaths`, `simulationActivities` and `simulationIterations`). They are made from the result of the run of the request
        (`runSimulation`) or, without a run, from the result that the project holds, which has no iterations, and thus no file of them. A
        project that holds no result, with no run, is a problem with the type `simulation-not-possible`.
      type: object
      additionalProperties: false
      properties:
        project:
          $ref: '#/components/schemas/OutputWithoutSettings'
        scenarioExport:
          $ref: '#/components/schemas/OutputWithoutSettings'
        ganttChart:
          $ref: '#/components/schemas/ChartOptions'
        arrowGraph:
          $ref: '#/components/schemas/GraphOptions'
        vertexGraph:
          $ref: '#/components/schemas/GraphOptions'
        resourceChart:
          $ref: '#/components/schemas/ChartOptions'
        earnedValueChart:
          $ref: '#/components/schemas/ChartOptions'
        scenarioChart:
          $ref: '#/components/schemas/ChartOptions'
        simulation:
          $ref: '#/components/schemas/ChartOptions'
    OutputWithoutSettings:
      description: An output with no settings at this time. The request gives it as an empty object, which can carry settings later.
      type: [object, 'null']
      additionalProperties: false
    ChartOptions:
      type: [object, 'null']
      additionalProperties: false
      required: [width, height]
      properties:
        format:
          type: [string, 'null']
          enum: [jpeg, png, bmp, webp, svg, null]
          default: jpeg
        width:
          type: [integer, 'null']
          minimum: 1
          description: In pixels. The maximum is the `maxChartWidth` of the server.
        height:
          type: [integer, 'null']
          minimum: 1
          description: In pixels. The maximum is the `maxChartHeight` of the server.
    GraphOptions:
      type: [object, 'null']
      additionalProperties: false
      properties:
        format:
          type: [string, 'null']
          enum: [jpeg, png, pdf, svg, graphml, dot, null]
          default: jpeg
    CompileResponse:
      type: object
      required: [metrics, outputs]
      properties:
        metrics:
          $ref: '#/components/schemas/Metrics'
        simulation:
          $ref: '#/components/schemas/Simulation'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/Output'
        console:
          $ref: '#/components/schemas/Console'
    Metrics:
      description: |
        The metrics of a compiled project. The names are words in `lowerCamelCase`, and the values are numbers and not the text that
        `zpp` prints. A metric that the server cannot calculate is `null`. The costs, billings and margins are estimates, and they have
        no currency.
      type: object
      required:
        - activityRisk
        - activityRiskWithStandardDeviationCorrection
        - criticalityRisk
        - fibonacciRisk
        - geometricActivityRisk
        - geometricCriticalityRisk
        - geometricFibonacciRisk
        - networkCyclomaticComplexity
        - networkDuration
        - networkDurationManMonths
        - projectFinishDays
        - projectFinishDate
        - effortEfficiency
        - activityEffort
        - directEffort
        - indirectEffort
        - otherEffort
        - totalEffort
        - directCost
        - indirectCost
        - otherCost
        - totalCost
        - directBilling
        - indirectBilling
        - otherBilling
        - totalBilling
        - directMargin
        - indirectMargin
        - otherMargin
        - totalMargin
        - directMarginAbsolute
        - indirectMarginAbsolute
        - otherMarginAbsolute
        - totalMarginAbsolute
      properties:
        activityRisk: { type: [number, 'null'] }
        activityRiskWithStandardDeviationCorrection: { type: [number, 'null'] }
        criticalityRisk: { type: [number, 'null'] }
        fibonacciRisk: { type: [number, 'null'] }
        geometricActivityRisk: { type: [number, 'null'] }
        geometricCriticalityRisk: { type: [number, 'null'] }
        geometricFibonacciRisk: { type: [number, 'null'] }
        networkCyclomaticComplexity: { type: [integer, 'null'] }
        networkDuration:
          type: [integer, 'null']
          description: In days.
        networkDurationManMonths: { type: [number, 'null'] }
        projectFinishDays:
          type: [integer, 'null']
          description: The number of days from the start of the project to its finish. `null` when the project has no duration.
        projectFinishDate:
          type: [string, 'null']
          format: date
          description: The date on which the project finishes, in the working calendar of the project. `null` when the project has no duration.
        effortEfficiency: { type: [number, 'null'] }
        activityEffort: { type: [number, 'null'] }
        directEffort: { type: [number, 'null'] }
        indirectEffort: { type: [number, 'null'] }
        otherEffort: { type: [number, 'null'] }
        totalEffort: { type: [number, 'null'] }
        directCost: { type: [number, 'null'] }
        indirectCost: { type: [number, 'null'] }
        otherCost: { type: [number, 'null'] }
        totalCost: { type: [number, 'null'] }
        directBilling: { type: [number, 'null'] }
        indirectBilling: { type: [number, 'null'] }
        otherBilling: { type: [number, 'null'] }
        totalBilling: { type: [number, 'null'] }
        directMargin: { type: [number, 'null'] }
        indirectMargin: { type: [number, 'null'] }
        otherMargin: { type: [number, 'null'] }
        totalMargin: { type: [number, 'null'] }
        directMarginAbsolute: { type: [number, 'null'] }
        indirectMarginAbsolute: { type: [number, 'null'] }
        otherMarginAbsolute: { type: [number, 'null'] }
        totalMarginAbsolute: { type: [number, 'null'] }
    Simulation:
      description: |
        What the simulation found. It is in the answer when the request runs the simulation, or the project holds a result. Like the
        metrics, the names are words in
        `lowerCamelCase`, and the values are numbers and not the text that `zpp` prints. Every time is in days from the start of the
        project, with the date on which it falls in the working calendar of the project. An iteration that the scheduler cannot
        place every activity in is a failed iteration, and it is in none of the statistics. A simulation in which every iteration
        fails has no statistics, and thus `null` values for them.
      type: object
      required:
        - iterations
        - validIterations
        - failedIterations
        - seed
        - distribution
        - modifiedBetaShape
        - plannedFinishDays
        - plannedFinishDate
        - meanDays
        - standardDeviationDays
        - earliestFinishDays
        - earliestFinishDate
        - latestFinishDays
        - latestFinishDate
        - percentiles
        - targetFinishDays
        - targetFinishDate
        - targetProbability
      properties:
        iterations:
          type: integer
          description: The number of iterations that the simulation ran, with the failed ones.
        validIterations:
          type: integer
          description: The number of iterations that gave a finish. Each statistic uses these.
        failedIterations:
          type: integer
        seed:
          type: string
          pattern: '^[0-9]{1,20}$'
          description: The seed that the simulation used, as text.
        distribution:
          type: string
          enum: [betaPert, modifiedBetaPert, triangular, normal, uniform]
        modifiedBetaShape:
          type: [number, 'null']
          description: The shape value that the simulation used. Only the distribution `modifiedBetaPert` has one.
        plannedFinishDays:
          type: integer
          description: The finish of the project as it stands, with the expected duration of each activity.
        plannedFinishDate:
          type: string
          format: date
        meanDays:
          type: [number, 'null']
        standardDeviationDays:
          type: [number, 'null']
          description: The deviation of the population, which divides by the number of valid iterations.
        earliestFinishDays:
          type: [integer, 'null']
        earliestFinishDate:
          type: [string, 'null']
          format: date
        latestFinishDays:
          type: [integer, 'null']
        latestFinishDate:
          type: [string, 'null']
          format: date
        percentiles:
          type: array
          description: The 5th, 10th, 25th, 50th, 75th, 80th, 90th, 95th and 99th percentiles. The array is empty when the simulation has no statistics.
          items:
            $ref: '#/components/schemas/SimulationPercentile'
        targetFinishDays:
          type: [integer, 'null']
          description: The target that the request gave.
        targetFinishDate:
          type: [string, 'null']
          format: date
        targetProbability:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: The share of the valid iterations that finish by the target, from 0 to 1.
    SimulationPercentile:
      type: object
      required: [percentile, finishDays, finishDate]
      properties:
        percentile:
          type: integer
          minimum: 1
          maximum: 99
        finishDays:
          type: integer
          description: The smallest finish that at least this share of the valid iterations reach (the nearest rank).
        finishDate:
          type: string
          format: date
    Output:
      type: object
      required: [kind, fileName, contentType]
      properties:
        kind:
          type: string
          enum:
            - project
            - scenarioExport
            - ganttChart
            - arrowGraph
            - vertexGraph
            - resourceChart
            - earnedValueChart
            - scenarioChart
            - simulationChart
            - simulationStatistics
            - simulationHistogram
            - simulationPaths
            - simulationActivities
            - simulationIterations
        fileName:
          type: string
          description: The name that `zpp` gives to the file.
        contentType:
          type: string
        content:
          type: string
          contentEncoding: base64
          description: The file. The `result.json` of a zip does not have it, because the zip contains the file itself.
    Console:
      description: |
        The text and the exit code of a local run of `zpp`, for a client that prints and writes exactly this, as `zpp --server` does. The
        console is in the answer when the request asks for it with `?include=console`.
      type: object
      required: [exitCode, standardOutput, standardError, transcript]
      properties:
        exitCode:
          type: integer
          description: The exit code of `zpp` in a local run.
        standardOutput:
          type: string
          description: Each line ends with `\n`.
        standardError:
          type: string
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptEntry'
    TranscriptEntry:
      description: One step of the job, in the order in which the job did it.
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [line, display, errorLine, output]
        text:
          type: string
          description: The text that a line or a block printed.
        hasErrors:
          type: boolean
          description: Shows if a block reports errors. The entry does not have it when the block reports no errors.
        index:
          type: integer
          minimum: 0
          description: The output that the job produced, by its index in `outputs`.
    ScenariosResponse:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/Scenario'
        console:
          $ref: '#/components/schemas/Console'
    Scenario:
      type: object
      required: [path, id, isTracked, isCurrent]
      properties:
        path:
          type: string
          description: The name of the scenario, with the names of the scenarios that it is a child of.
        id:
          type: string
          format: uuid
        isTracked:
          type: boolean
          description: |
            Shows if the scenario is tracked. The scenario chart shows the metrics of a tracked scenario as a point, against the metrics of
            the axes of the chart. Tracking does only this. It does not change how the scenario compiles, what its metrics are, or what any
            other output holds. It is not the progress tracking of activities.
        isCurrent:
          type: boolean
          description: |
            Shows if the scenario is the current scenario of the project. This is the scenario that was open when a user saved the project.
            `zpp` loads it when the request does not name a scenario. A project has a maximum of one current scenario.
    JobStatus:
      description: |
        A job that the server runs now. The server has a status for a job only while the job runs, and thus `state` has one value.
      type: object
      required: [id, state, startedAt, elapsed, progress]
      properties:
        id:
          $ref: '#/components/schemas/TraceId'
          description: The id of the job. It is the id of the request that began it.
        state:
          type: string
          enum: [running]
        startedAt:
          type: string
          format: date-time
          description: When the server began the job.
        elapsed:
          $ref: '#/components/schemas/Duration'
          description: The time since the server began the job.
        progress:
          description: How far the job has got in the simulation. It is `null` when the job does not run a simulation, and before the simulation begins.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JobProgress'
    JobProgress:
      type: object
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
          description: The iterations that have run.
        total:
          type: integer
          minimum: 1
          description: The iterations that the simulation has.
    InfoResponse:
      type: object
      required: [version, culture, timeZone, limits]
      properties:
        version:
          type: string
        culture:
          type: string
          description: The culture in which the server writes numbers and dates.
        timeZone:
          type: string
          description: The time zone in which the server writes times, by its IANA name.
        limits:
          $ref: '#/components/schemas/Limits'
    Limits:
      type: object
      required: [maxJobs, maxQueue, maxUploadMegabytes, maxChartWidth, maxChartHeight, maxSimulationIterations, jobTimeout, maxCompileTimeout]
      properties:
        maxJobs:
          type: integer
          minimum: 1
          description: Jobs that run at one time.
        maxQueue:
          type: integer
          minimum: 0
          description: Jobs that wait for a free place. The server turns away more requests.
        maxUploadMegabytes:
          type: integer
          minimum: 1
          description: The largest request, in megabytes of 1,048,576 bytes.
        maxChartWidth:
          type: integer
          minimum: 1
        maxChartHeight:
          type: integer
          minimum: 1
        maxSimulationIterations:
          type: integer
          minimum: 1
          maximum: 1000000
          description: The most iterations that a simulation of a project can have for the server to run it. The `jobTimeout` also stops a simulation that is too slow.
        jobTimeout:
          $ref: '#/components/schemas/Duration'
          description: The time that a job can use before the server stops it.
        maxCompileTimeout:
          $ref: '#/components/schemas/Duration'
          description: The longest compile timeout that a request can give.
    ProblemError:
      type: object
      required: [detail]
      properties:
        pointer:
          type: string
          description: The location of the problem, as a JSON pointer in URI-fragment form into the request (`CompileRequest`).
        parameter:
          type: string
          description: The query parameter that has the problem, in place of `pointer`.
        code:
          description: |
            The rule that the request breaks, for programs. It is one of the codes in the list. For a project that did not compile, it is the
            code of the compiler for the error, for example `P0010`.
          anyOf:
            - type: string
              enum:
                - required
                - unknownProperty
                - wrongType
                - notAllowed
                - invalidFormat
                - outOfRange
                - notAllowedWithImport
                - noResult
                - tooLarge
                - unsupportedFormat
                - unreadable
                - noKnownSheet
                - missingHeader
                - missingColumn
                - duplicateColumn
                - missingValue
                - duplicateId
                - unknownActivity
                - excelError
                - notAWholeNumber
                - notANumber
                - notTrueOrFalse
                - notADate
                - notAChoice
                - notAColor
                - notFound
                - ambiguous
                - hasNoData
                - failed
            - type: string
              pattern: '^[A-Z][0-9]{4}$'
              description: The code of the compiler for an error, for example `P0010`.
        detail:
          type: string
          description: What is wrong, for persons. It is a phrase that continues from the location.
    Problem:
      description: Problem details, as RFC 9457 gives them.
      type: object
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: The same for each problem of its type.
        status:
          type: integer
        detail:
          type: string
          description: What is wrong this time, for persons.
        traceId:
          $ref: '#/components/schemas/TraceId'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
        console:
          $ref: '#/components/schemas/Console'
    StatusProblem:
      description: A problem that has only its status, with the type that RFC 9110 gives to the status.
      allOf:
        - $ref: '#/components/schemas/Problem'
    MalformedRequestProblem:
      description: The server cannot understand the request.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#malformed-request
            status:
              const: 400
    ValidationFailedProblem:
      description: The server understands the request, but what it says is not valid. `errors` has each problem.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#validation-failed
            status:
              const: 422
    ProjectNotReadableProblem:
      description: |
        The server cannot read the file that the request sends as the project or as the workbook to import. A workbook that has
        problems in its cells is read in full and not imported: `errors` has one error for each problem, at `#/import`, up to 100.
        The `detail` of each error gives the place of the problem (the sheet and the cell, the title of the column, and the name
        of the row) and says what is wrong. The `detail` of the problem gives the number of problems.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#project-not-readable
            status:
              const: 422
    CompilationFailedProblem:
      description: The project has compilation errors. `errors` has each error with the code of the compiler.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#compilation-failed
            status:
              const: 422
    CompilationTimedOutProblem:
      description: The compilation did not end within its time limit. This does not show if the project is valid.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#compilation-timed-out
            status:
              const: 422
    ScenarioNotSelectableProblem:
      description: The server cannot select the scenario that the request names.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#scenario-not-selectable
            status:
              const: 422
    SimulationNotPossibleProblem:
      description: The simulation that the request asks for cannot be done with the project. Its settings are not ones that a run can use, or the request asks for the outputs of a simulation, and the project holds no result and the request does not run the simulation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#simulation-not-possible
            status:
              const: 422
    OutputFailedProblem:
      description: The project compiled, but the job did not produce an output that the request asked for. The problem has the metrics, the statistics of the simulation if the job ran one, and the outputs that the job produced.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#output-failed
            status:
              const: 500
            metrics:
              $ref: '#/components/schemas/Metrics'
            simulation:
              $ref: '#/components/schemas/Simulation'
            outputs:
              type: array
              items:
                $ref: '#/components/schemas/Output'
    UnexpectedErrorProblem:
      description: A failure that the server did not expect. The cause is in the log of the server, under the trace id of the request. It is not in the answer.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#unexpected-error
            status:
              const: 500
    BusyProblem:
      description: The server runs the maximum number of jobs at one time, and the maximum number of jobs wait. Send the request again after the time in `Retry-After`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#busy
            status:
              const: 503
    JobTimeoutProblem:
      description: The job used more time than the server allows for a job, and the server stopped it. If you send the request again without a change, the job reaches the time limit again.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              const: https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md#job-timeout
            status:
              const: 503
