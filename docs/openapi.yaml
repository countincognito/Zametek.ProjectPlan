openapi: 3.1.0
info:
  title: zpp serve API
  summary: Compile Zametek Project Plan projects, and list their scenarios, over HTTP.
  description: |
    The HTTP API of `zpp serve`, which starts `zpp` as a web server. Each request carries its project, because the server keeps
    nothing between requests. The server answers with the metrics of the project, the statistics of the simulation of its schedule
    if the request runs one or the project holds a result, and the outputs that the request asks for. These outputs are the project
    file, charts and graphs, an Excel export, and the chart and the CSV files of the simulation.

    This description is the source of truth for programs. [docs/API.md](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/API.md)
    is the written reference. It has the changelog, the security review and the deviations from the
    [RESTful API Guide](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md), which the API
    follows. The `type` URIs of the problems are the addresses of the sections of that reference.

    The server supplies this description itself, at `GET /v1/openapi`, without an API key. It is the file of the repository, in the
    version from the time of the build of the server. A description that you read from the repository names no server of its own,
    and thus a tool receives the address of a server. A description that you fetch from a server describes that server.

    Each response, including a problem, has `Request-Id`. This is 32 hexadecimal characters. It is the `traceId` of a problem. It is
    also the trace id on each line of the server log that belongs to the request. A request that has a `traceparent` keeps
    the trace that it names.

    The server stores nothing, and thus it is safe to send each POST again. The same request has the same result.

    ## Deviations from the RESTful API Guide

    The API follows the [RESTful API Guide](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md), version 1.2. The guide asks that the description records each deviation. A deviation is a rule that the API does not follow, or an option that a rule gives to the API. The description gives the reason for each deviation ([DOC-2](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#13-documentation-testing-and-governance),
    [section 0.5](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#05-deviations)):

    - [**ASY-1**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#9-long-running-and-bulk-operations) - The API answers a job in its request, and `jobTimeout` limits the job. If a job uses more time, the server stops it (`503`) and does not continue it as a `202`. The server keeps nothing between requests. To continue a job, the server must keep results, owners and an expiry. ASY-1 lets a service that keeps nothing stop the job at its limit instead. While a job runs, `GET /v1/jobs/{requestId}` tells how far it has got (ASY-2). The server keeps this status only for as long as the job runs.
    - [**REP-7**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#3-representations) - The costs, billings and margins in `metrics` are floating-point numbers. The engine calculates them in this way, and a project has no currency. They are estimates in the unit of the figures of the project, and not amounts of money. REP-7 lets such values be JSON numbers.
    - [**COL-1**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#51-the-collection-representation), [**COL-2**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#52-paging-sorting-filtering-and-selection) - `scenarios` and `outputs` are plain arrays and not paged `items`. They are bounded parts of what the caller sent, and not collections that the server holds. COL-1 says that a bounded array inside a representation is a plain array under a descriptive name.
    - [**ACT-4**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#12-actions-procedural-concepts), [**REQ-1**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#4-requests) - `POST /v1/projects/scenarios` only reads, and requests are `multipart/form-data`. A project is a file, and a file cannot go in a URL.
    - [**RL-3**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#11-rate-limiting-and-resource-protection) - The API has no `RateLimit` fields. They are still an Internet-Draft. The limit is a cap on the jobs at one time, and not a rate. `Retry-After` and `limits` give the other information.
    - [**OPS-3**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#14-operations) - The API has no availability objective. `zpp serve` is a tool that its users operate for themselves, and `jobTimeout` limits its latency.
    - [**ERR-1**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#7-errors) - `408`, `414` and `431`, and a request that the web server cannot read, have no body. The web server answers them before the API gets them, and it cannot write a body.
    - [**SEC-3**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#101-transport), [**SEC-15**](https://github.com/countincognito/Zametek.ProjectPlan/blob/develop/docs/RESTFUL-API-GUIDE.md#104-input-and-resources) - The API has no HSTS and no CORS. No browser calls this API. A proxy that ends TLS can add HSTS.
  version: 1.0.0
  contact:
    name: Zametek.ProjectPlan
    url: https://github.com/countincognito/Zametek.ProjectPlan
  license:
    name: BSD 2-Clause License
    identifier: BSD-2-Clause
servers:
  - url: /
    description: The server from which a client fetches this description
  - url: http://localhost:9770
    description: The default address of `zpp serve`, on this computer
tags:
  - name: Projects
    description: What the API does with a project.
  - name: Jobs
    description: A job that the server runs now.
  - name: Server
    description: Information about the server.
  - name: Probes
    description: Health checks, which need no API key.
security:
  - apiKey: []
paths:
  /v1/projects/compile:
    post:
      operationId: compileProject
      tags: [Projects]
      summary: Compile a project
      description: |
        This operation compiles the project in the request. The request can have an Excel workbook instead, which the server imports
        into a new project. The server answers with the metrics of the project and the outputs that the options ask for. If the options
        run the simulation, the server runs it after the project compiles, with the settings that the project holds, and the answer has
        its statistics. If they do not, and the project holds the result of an earlier run, the answer has the statistics of that
        result. The status is `200`
        only when the project compiled and the job produced each output. Each other result is a problem, and its status shows the
        reason.

        With `Accept: application/zip`, the answer is a zip. It contains each output as a file, with the name that `zpp` gives it. It also
        contains `result.json`, which is the JSON answer without the contents of the files.
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompileRequest'
            encoding:
              project:
                contentType: application/octet-stream
              import:
                contentType: application/octet-stream
              options:
                contentType: application/json
      responses:
        '200':
          description: The project compiled, and the job produced each output that the request asked for.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Vary:
              description: The answer varies with what the request accepts.
              required: true
              schema:
                type: string
                const: Accept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileResponse'
              examples:
                compiled:
                  $ref: '#/components/examples/CompiledProject'
                compiledWithOutputs:
                  $ref: '#/components/examples/CompiledProjectWithOutputs'
                compiledWithSimulation:
                  $ref: '#/components/examples/CompiledProjectWithSimulation'
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
    options:
      operationId: optionsCompileProject
      tags: [Projects]
      summary: What the endpoint takes
      description: This operation says that the endpoint takes a POST, and what it takes in one. It needs the API key, as the other operations under `/v1` do.
      responses:
        '204':
          $ref: '#/components/responses/OptionsPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects/scenarios:
    post:
      operationId: listScenarios
      tags: [Projects]
      summary: List a project's scenarios
      description: |
        This operation lists the scenarios of the project in the request, as `zpp --list-scenarios` does. It only reads. It does not
        change or keep anything.
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScenariosRequest'
            encoding:
              project:
                contentType: application/octet-stream
      responses:
        '200':
          description: The scenarios of the project.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenariosResponse'
              examples:
                twoScenarios:
                  $ref: '#/components/examples/TwoScenarios'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
    options:
      operationId: optionsListScenarios
      tags: [Projects]
      summary: What the endpoint takes
      description: This operation says that the endpoint takes a POST, and what it takes in one. It needs the API key, as the other operations under `/v1` do.
      responses:
        '204':
          $ref: '#/components/responses/OptionsPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/info:
    get:
      operationId: getInfo
      tags: [Server]
      summary: Ask what the server is
      description: |
        This operation gives the version of the server, the culture in which it writes numbers and dates, its time zone, and its limits.
        This information cannot change while the server operates. Thus, the response has a strong `ETag`, and a client can keep it for
        one minute.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Information about the server.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: The client that asked can keep the response for one minute.
              required: true
              schema:
                type: string
                const: private, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
              examples:
                server:
                  $ref: '#/components/examples/Server'
        '304':
          description: The client has the current information about the server, as the `ETag` shows.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    head:
      operationId: headInfo
      tags: [Server]
      summary: The headers of the information about the server
      description: This operation answers with the headers of `GET`, with the `ETag`, and with no body.
      responses:
        '200':
          description: The headers of `GET`, and no body.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
    options:
      operationId: optionsInfo
      tags: [Server]
      summary: What the endpoint takes
      description: This operation says that the endpoint takes `GET` and `HEAD`. It needs the API key, as the other operations under `/v1` do.
      responses:
        '204':
          $ref: '#/components/responses/OptionsGet'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/jobs/{requestId}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Ask how far a job that runs has got
      description: |
        This operation tells how far a job has got. The job is a request to compile a project, and its id is the id of the request: the
        trace id that the request gave in its `traceparent`. The server answers the request when the job ends. A caller that waits for
        the answer can ask here, as often as `Retry-After` says, how many iterations of the simulation have run.

        The server keeps nothing of a job after it ends. Thus, a job that has not begun, and a job that has ended, have no status (`404`),
        and the answer to the request of the job is the only word of its end. A request that has no `traceparent` has a trace id that the
        server chooses, and the caller does not know it before the answer comes. This operation is not for such a request. The operation
        does not use a place among the jobs. Thus, it answers also when all the jobs at one time run.
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The job runs.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
              examples:
                running:
                  $ref: '#/components/examples/JobRunning'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    options:
      operationId: optionsGetJob
      tags: [Jobs]
      summary: What the endpoint takes
      description: This operation says that the endpoint takes `GET`. It needs the API key, as the other operations under `/v1` do.
      responses:
        '204':
          $ref: '#/components/responses/OptionsGetOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/openapi:
    get:
      operationId: getDescription
      tags: [Server]
      summary: Fetch the description of this API
      description: |
        This operation gives this description as YAML, in the version from the time of the build of the server. It is the file of the
        repository. Thus, a server describes what it takes, and not what a different version of it took. The description holds only what
        is in the repository, and thus it needs no API key. It cannot change while the server operates. Thus, the response has a strong
        `ETag`, and any cache can keep it for one hour.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: This description.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Any cache can keep the response for one hour.
              required: true
              schema:
                type: string
                const: public, max-age=3600
            Vary:
              description: The answer varies with what the request accepts.
              required: true
              schema:
                type: string
                const: Accept
          content:
            application/openapi+yaml:
              schema:
                type: string
              examples:
                start:
                  summary: The start of the description
                  value: |
                    openapi: 3.1.0
                    info:
                      title: zpp serve API
                      summary: Compile Zametek Project Plan projects, and list their scenarios, over HTTP.
            application/yaml:
              schema:
                type: string
        '304':
          description: The client has this description, as the `ETag` shows.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    head:
      operationId: headDescription
      tags: [Server]
      summary: The headers of the description
      description: This operation answers with the headers of `GET`, with the `ETag`, and with no body. It needs no API key.
      security: []
      responses:
        '200':
          description: The headers of `GET`, and no body.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
    options:
      operationId: optionsDescription
      tags: [Server]
      summary: What the endpoint takes
      description: This operation says that the endpoint takes `GET` and `HEAD`. It needs no API key, because they need none.
      security: []
      responses:
        '204':
          $ref: '#/components/responses/OptionsGet'
  /health/live:
    get:
      operationId: getLive
      tags: [Probes]
      summary: Is the server listening
      description: This operation answers 200 when the server listens. It needs no API key, and thus a load balancer or an orchestrator can ask.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /health/ready:
    get:
      operationId: getReady
      tags: [Probes]
      summary: Is the server ready
      description: This operation answers 200 after the warm-up of the server with a sample project, which takes some seconds after the start, and 503 before that. It needs no API key.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: The warm-up of the server is not complete.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain:
              schema:
                type: string
                const: Unhealthy
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        The API key of the server. It has a minimum of 32 characters, and `openssl rand -base64 32` makes such a key. A server that only
        this computer can reach needs no key.
  parameters:
    Include:
      name: include
      in: query
      description: |
        What the server adds to the answer, as a comma-separated list. The value `console` adds the text and the exit code of a local run
        of `zpp` to the answer or to the problem. Any other value and any other query parameter is a problem with the request.
      required: false
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [console]
    Traceparent:
      name: traceparent
      in: header
      description: The W3C trace context of the request. The request keeps its trace id, which is its `Request-Id`.
      required: false
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    RequestIdPath:
      name: requestId
      in: path
      description: The id of the request that began the job. It is the trace id that the request gave in its `traceparent`.
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{32}$'
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The `ETag` that the client has. The server answers `304` if the `ETag` is current.
      required: false
      schema:
        type: string
  headers:
    RequestId:
      description: The id of the request. It is the trace id of the request and the `traceId` of its problem.
      required: true
      schema:
        $ref: '#/components/schemas/TraceId'
    ETag:
      description: A strong validator of the response.
      required: true
      schema:
        type: string
        pattern: '^"[0-9a-f]{32}"$'
    RetryAfter:
      description: The number of seconds to wait before you send the request again.
      required: true
      schema:
        type: integer
        minimum: 0
    NoStore:
      description: A cache must not keep the response.
      required: true
      schema:
        type: string
        const: no-store
  responses:
    MalformedRequest:
      description: The server cannot understand the request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MalformedRequestProblem'
          examples:
            malformedRequest:
              $ref: '#/components/examples/MalformedRequest'
    Unauthorized:
      description: The request needs the API key, and it does not have the key or it has an incorrect key.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          description: How to authenticate.
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatusProblem'
          examples:
            unauthorized:
              $ref: '#/components/examples/Unauthorized'
    NotFound:
      description: No job with this id runs now. It has not begun, or it has ended.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatusProblem'
          examples:
            jobNotRunning:
              $ref: '#/components/examples/JobNotRunning'
    NotAcceptable:
      description: '`Accept` offers nothing that the operation can answer with. `detail` says what it can answer with.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatusProblem'
          examples:
            notAcceptable:
              $ref: '#/components/examples/NotAcceptable'
    PayloadTooLarge:
      description: The request is larger than the server accepts, or its `options` are larger than 64 KB.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatusProblem'
    UnsupportedMediaType:
      description: The request is not `multipart/form-data`, or the file to import is not an Excel workbook.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatusProblem'
          examples:
            notMultipart:
              $ref: '#/components/examples/NotMultipart'
            notAWorkbook:
              $ref: '#/components/examples/NotAWorkbook'
    Unprocessable:
      description: |
        The server understands the request, but what it says is not valid, or the server cannot process the project or what the request
        asks for. `type` shows which.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationFailedProblem'
              - $ref: '#/components/schemas/ProjectNotReadableProblem'
              - $ref: '#/components/schemas/CompilationFailedProblem'
              - $ref: '#/components/schemas/CompilationTimedOutProblem'
              - $ref: '#/components/schemas/ScenarioNotSelectableProblem'
              - $ref: '#/components/schemas/SimulationNotPossibleProblem'
          examples:
            validationFailed:
              $ref: '#/components/examples/ValidationFailed'
            projectNotReadable:
              $ref: '#/components/examples/ProjectNotReadable'
            projectNotReadableWorkbook:
              $ref: '#/components/examples/ProjectNotReadableWorkbook'
            compilationFailed:
              $ref: '#/components/examples/CompilationFailed'
            compilationTimedOut:
              $ref: '#/components/examples/CompilationTimedOut'
            scenarioNotSelectable:
              $ref: '#/components/examples/ScenarioNotSelectable'
            simulationNotPossible:
              $ref: '#/components/examples/SimulationNotPossible'
    ServerFailed:
      description: The server failed. `type` shows if the job did not produce an output, or if something happened that nobody expected.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OutputFailedProblem'
              - $ref: '#/components/schemas/UnexpectedErrorProblem'
          examples:
            outputFailed:
              $ref: '#/components/examples/OutputFailed'
            unexpectedError:
              $ref: '#/components/examples/UnexpectedError'
    Unavailable:
      description: The server is busy, or the job used more time than the server allows. `type` shows which.
      headers:
